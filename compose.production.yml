name: inventory-management-production

services:
  api:
    image: ${API_IMAGE_REPOSITORY:-inventory-management-api}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: InventoryManagement.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in the environment file}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - inventory_network

  migrate:
    image: ${API_IMAGE_REPOSITORY:-inventory-management-api}:${IMAGE_TAG:-local}
    profiles:
      - migration
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in the environment file}
    entrypoint:
      - ./efbundle
    command:
      - --no-color
      - --prefix-output
    networks:
      - inventory_network

  frontend:
    image: ${FRONTEND_IMAGE_REPOSITORY:-inventory-management-web}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: InventoryManagement.Web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - inventory_network

networks:
  inventory_network:
    driver: bridge
