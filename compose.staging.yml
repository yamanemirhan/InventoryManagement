name: inventory-management-staging

services:
  api:
    logging:
      driver: journald
      options:
        tag: inventory-staging-api
    image: ${API_IMAGE_REPOSITORY:-inventory-management-api}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: InventoryManagement.Api/Dockerfile
    restart: unless-stopped
    environment:
      Authentication__Authority: ${KEYCLOAK_AUTHORITY:?Set KEYCLOAK_AUTHORITY}
      Authentication__Audience: inventory-api
      Mail__HostBase64: ${MAIL_HOST_BASE64:-}
      Mail__PortBase64: ${MAIL_PORT_BASE64:-}
      Mail__UsernameBase64: ${MAIL_USERNAME_BASE64:-}
      Mail__PasswordBase64: ${MAIL_PASSWORD_BASE64:-}
      Mail__FromBase64: ${MAIL_FROM_BASE64:-}
      Mail__ImplicitTlsBase64: ${MAIL_IMPLICITTLS_BASE64:-}
      Mail__AppOrigin: ${KEYCLOAK_URL}
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in the environment file}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - inventory_network

  migrate:
    image: ${API_IMAGE_REPOSITORY:-inventory-management-api}:${IMAGE_TAG:-local}
    profiles:
      - migration
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in the environment file}
    entrypoint:
      - ./efbundle
    command:
      - --no-color
      - --prefix-output
    networks:
      - inventory_network

  frontend:
    logging:
      driver: journald
      options:
        tag: inventory-staging-web
    image: ${FRONTEND_IMAGE_REPOSITORY:-inventory-management-web}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: InventoryManagement.Web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:?Set KEYCLOAK_URL}
      KEYCLOAK_REALM: inventory-staging
      KEYCLOAK_CLIENT_ID: inventory-web
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - inventory_network

networks:
  inventory_network:
    driver: bridge
