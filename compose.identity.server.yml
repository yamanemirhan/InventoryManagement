# Persistent identity stack. Project directory contains .env.identity and realms/.
name: inventory-identity-${IDENTITY_ENVIRONMENT:?Set IDENTITY_ENVIRONMENT}

services:
  identity-db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${IDENTITY_DB_PORT:?Set IDENTITY_DB_PORT}:5432"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    shm_size: 128m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=60"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start", "--import-realm"]
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL:?Set the public HTTPS URL including /identity}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_HTTP_MANAGEMENT_SCHEME: http
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx768m"
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HTTP_POOL_MAX_THREADS: "24"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.0 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 90s
    ports:
      - "127.0.0.1:${IDENTITY_HTTP_PORT:?Set IDENTITY_HTTP_PORT}:8080"
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
      - ./themes:/opt/keycloak/themes:ro

volumes:
  identity_postgres_data:
