name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InventoryManagement.slnx

      - name: Build
        run: dotnet build InventoryManagement.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test InventoryManagement.UnitTests/InventoryManagement.UnitTests.csproj --configuration Release --no-build --no-restore

      - name: Run integration tests
        run: dotnet test InventoryManagement.IntegrationTests/InventoryManagement.IntegrationTests.csproj --configuration Release --no-build --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: InventoryManagement.Web
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: InventoryManagement.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_RESOURCE_GROUP: rg-inventory-learning
      AZURE_NSG_NAME: nsg-inventory-learning
      TEMPORARY_SSH_RULE: Allow-SSH-GitHub-Runner
      API_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/inventory-management-api
      FRONTEND_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/inventory-management-web
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/inventory-management-api:${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/inventory-management-web:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build production Docker images
        run: |
          set -Eeuo pipefail

          docker build \
            --file InventoryManagement.Api/Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${API_IMAGE}" \
            .

          docker build \
            --file InventoryManagement.Web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL= \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${FRONTEND_IMAGE}" \
            .

          docker image inspect "${API_IMAGE}" "${FRONTEND_IMAGE}" > /dev/null

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        run: |
          set -Eeuo pipefail
          docker push "${API_IMAGE}"
          docker push "${FRONTEND_IMAGE}"

      - name: Log in to Azure with OIDC
        id: azure-login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Temporarily allow runner SSH access
        run: |
          set -Eeuo pipefail

          runner_ip="$(curl -4 --fail --silent --show-error https://api.ipify.org)"
          if [[ ! "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Could not determine a valid runner IPv4 address." >&2
            exit 1
          fi

          for attempt in {1..12}; do
            if az network nsg rule create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --nsg-name "$AZURE_NSG_NAME" \
              --name "$TEMPORARY_SSH_RULE" \
              --priority 130 \
              --direction Inbound \
              --access Allow \
              --protocol Tcp \
              --source-address-prefixes "${runner_ip}/32" \
              --source-port-ranges '*' \
              --destination-address-prefixes '*' \
              --destination-port-ranges 22; then
              exit 0
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Could not create the temporary SSH rule." >&2
              exit 1
            fi

            sleep 10
          done

      - name: Configure SSH
        id: configure-ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Log in server to GitHub Container Registry
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          for attempt in {1..12}; do
            if printf '%s' "${GHCR_TOKEN}" \
              | ssh \
                  -i ~/.ssh/id_ed25519 \
                  -o BatchMode=yes \
                  -o ConnectTimeout=10 \
                  "${SERVER_USER}@${SERVER_HOST}" \
                  "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"; then
              exit 0
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Server login to GitHub Container Registry failed after waiting for SSH access." >&2
              exit 1
            fi

            sleep 5
          done

      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          for attempt in {1..12}; do
            if ssh \
              -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              "${SERVER_USER}@${SERVER_HOST}" \
              "DEPLOY_SHA='${DEPLOY_SHA}' API_IMAGE_REPOSITORY='${API_IMAGE_REPOSITORY}' FRONTEND_IMAGE_REPOSITORY='${FRONTEND_IMAGE_REPOSITORY}' bash -s" \
              < scripts/deploy-production.sh; then
              exit 0
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Deployment failed after waiting for SSH access." >&2
              exit 1
            fi

            sleep 5
          done

      - name: Log out server from GitHub Container Registry
        if: always() && steps.configure-ssh.outcome == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "docker logout ghcr.io" || true

      - name: Revoke runner SSH access
        if: always() && steps.azure-login.outcome == 'success'
        run: |
          if az network nsg rule show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --nsg-name "$AZURE_NSG_NAME" \
            --name "$TEMPORARY_SSH_RULE" > /dev/null 2>&1; then
            az network nsg rule delete \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --nsg-name "$AZURE_NSG_NAME" \
              --name "$TEMPORARY_SSH_RULE"
          fi
