name: CI
"on":
  push:
    branches:
      - main
      - develop
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      operation:
        description: Manual operational task (validate runs normal build checks)
        type: choice
        default: validate
        options:
          - validate
          - inspect
          - install
          - backup
          - restore-drill
          - monitor
          - alert-check
          - status
          - restart-staging-identity
          - tune-staging-identity
      alert_recipient:
        description: Alert email recipient (install only)
        type: string
        default: ""
permissions:
  contents: read
jobs:
  backend:
    name: Backend
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore InventoryManagement.slnx
      - name: Build
        run: dotnet build InventoryManagement.slnx --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test InventoryManagement.UnitTests/InventoryManagement.UnitTests.csproj --configuration Release --no-build --no-restore
      - name: Run integration tests
        run: dotnet test InventoryManagement.IntegrationTests/InventoryManagement.IntegrationTests.csproj --configuration Release --no-build --no-restore
  frontend:
    name: Frontend
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: InventoryManagement.Web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: InventoryManagement.Web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
  publish-images:
    name: Publish Docker images
    needs:
      - backend
      - frontend
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/inventory-management-api
      FRONTEND_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/inventory-management-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate semantic version tag
        if: github.ref_type == 'tag'
        run: |
          set -Eeuo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use the stable SemVer format vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
      - name: Generate API image tags
        id: api_metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.API_IMAGE_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Generate frontend image tags
        id: frontend_metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up native ARM64 Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: InventoryManagement.Api/Dockerfile
          push: true
          tags: ${{ steps.api_metadata.outputs.tags }}
          labels: ${{ steps.api_metadata.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,mode=max,scope=api-arm64
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: InventoryManagement.Web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
          tags: ${{ steps.frontend_metadata.outputs.tags }}
          labels: ${{ steps.frontend_metadata.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha,scope=web-arm64
          cache-to: type=gha,mode=max,scope=web-arm64
  deploy:
    name: Deploy to production
    needs:
      - publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: inventory-server-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
      API_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/inventory-management-api
      FRONTEND_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/inventory-management-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure SSH
        id: configure-ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/inventory-deploy
          chmod 600 ~/.ssh/inventory-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/inventory-deploy > /dev/null
      - name: Log in server to GitHub Container Registry
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          for attempt in {1..12}; do
            if printf '%s' "${GHCR_TOKEN}" \
              | ssh \
                  -i ~/.ssh/inventory-deploy \
                  -o BatchMode=yes \
                  -o ConnectTimeout=10 \
                  "${SERVER_USER}@${SERVER_HOST}" \
                  "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"; then
              exit 0
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Server login to GitHub Container Registry failed after waiting for SSH access." >&2
              exit 1
            fi

            sleep 5
          done
      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_STAGE: production
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/inventory-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "DEPLOY_STAGE='${DEPLOY_STAGE}' DEPLOY_SHA='${DEPLOY_SHA}' API_IMAGE_REPOSITORY='${API_IMAGE_REPOSITORY}' FRONTEND_IMAGE_REPOSITORY='${FRONTEND_IMAGE_REPOSITORY}' bash -s" \
            < scripts/deploy-environment.sh
      - name: Log out server from GitHub Container Registry
        if: always() && steps.configure-ssh.outcome == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -i ~/.ssh/inventory-deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "docker logout ghcr.io" || true
  deploy-staging:
    name: Deploy to staging
    needs:
      - publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: inventory-server-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/inventory-management-api
      FRONTEND_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/inventory-management-web
      STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure SSH
        id: configure-ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/inventory-deploy
          chmod 600 ~/.ssh/inventory-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/inventory-deploy > /dev/null
      - name: Log in server to GitHub Container Registry
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          for attempt in {1..12}; do
            if printf '%s' "${GHCR_TOKEN}" \
              | ssh \
                  -i ~/.ssh/inventory-deploy \
                  -o BatchMode=yes \
                  -o ConnectTimeout=10 \
                  "${SERVER_USER}@${SERVER_HOST}" \
                  "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"; then
              exit 0
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Server login to GitHub Container Registry failed after waiting for SSH access." >&2
              exit 1
            fi

            sleep 5
          done
      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_STAGE: staging
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/inventory-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "DEPLOY_STAGE='${DEPLOY_STAGE}' DEPLOY_SHA='${DEPLOY_SHA}' API_IMAGE_REPOSITORY='${API_IMAGE_REPOSITORY}' FRONTEND_IMAGE_REPOSITORY='${FRONTEND_IMAGE_REPOSITORY}' bash -s" \
            < scripts/deploy-environment.sh
      - name: Verify public health endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            "${STAGING_HEALTH_URL}"
      - name: Log out server from GitHub Container Registry
        if: always() && steps.configure-ssh.outcome == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -i ~/.ssh/inventory-deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "docker logout ghcr.io" || true
  operations:
    name: Manual operations
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: inventory-server-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    env: {}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure SSH
        id: configure-ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/inventory-deploy
          chmod 600 ~/.ssh/inventory-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/inventory-deploy > /dev/null
      - name: Run authorized operational task
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          OPERATION: ${{ inputs.operation }}
          ALERT_RECIPIENT: ${{ inputs.alert_recipient }}
          BACKUP_PASSPHRASE: ${{ secrets.INVENTORY_BACKUP_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          case "$OPERATION" in inspect|install|backup|restore-drill|monitor|alert-check|status|restart-staging-identity|tune-staging-identity) ;; *) exit 1;; esac
          remote="/tmp/inventory-operations-${GITHUB_RUN_ID}.py"
          recipient64="$(printf '%s' "$ALERT_RECIPIENT" | base64 -w0)"
          trap 'ssh -i ~/.ssh/inventory-deploy -o BatchMode=yes -o ConnectTimeout=10 "$SERVER_USER@$SERVER_HOST" "rm -f $remote" || true' EXIT
          scp -i ~/.ssh/inventory-deploy -o BatchMode=yes -o ConnectTimeout=10 scripts/operations.py "$SERVER_USER@$SERVER_HOST:$remote"
          printf '%s' "$BACKUP_PASSPHRASE" | ssh -i ~/.ssh/inventory-deploy -o BatchMode=yes -o ConnectTimeout=10 "$SERVER_USER@$SERVER_HOST" \
            "sudo -n python3 $remote $OPERATION --recipient \"\$(printf '%s' '$recipient64' | base64 --decode)\""
