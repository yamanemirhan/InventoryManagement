name: Rollback production
"on":
  workflow_dispatch:
    inputs:
      target:
        description: Exact image version (for example 1.0.0) or full Git commit SHA
        required: true
        type: string
      confirm_production_rollback:
        description: I confirm that production should use this image version
        required: true
        type: boolean
permissions:
  contents: read
jobs:
  rollback:
    name: Roll back production
    if: inputs.confirm_production_rollback == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: inventory-server-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/inventory-management-api
      FRONTEND_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/inventory-management-web
      TARGET_IMAGE_TAG: ${{ inputs.target }}
      PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate rollback target
        run: |
          set -Eeuo pipefail
          if [[ ! "${TARGET_IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]] \
            && [[ ! "${TARGET_IMAGE_TAG}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Rollback target must be an exact X.Y.Z version or a full 40-character Git SHA." >&2
            exit 1
          fi
      - name: Configure SSH
        id: configure-ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/inventory-deploy
          chmod 600 ~/.ssh/inventory-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/inventory-deploy > /dev/null
      - name: Log in server to GitHub Container Registry
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          for attempt in {1..12}; do
            if printf '%s' "${GHCR_TOKEN}" \
              | ssh \
                  -i ~/.ssh/inventory-deploy \
                  -o BatchMode=yes \
                  -o ConnectTimeout=10 \
                  "${SERVER_USER}@${SERVER_HOST}" \
                  "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"; then
              exit 0
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Server login to GitHub Container Registry failed after waiting for SSH access." >&2
              exit 1
            fi

            sleep 5
          done
      - name: Roll back application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i ~/.ssh/inventory-deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "TARGET_IMAGE_TAG='${TARGET_IMAGE_TAG}' API_IMAGE_REPOSITORY='${API_IMAGE_REPOSITORY}' FRONTEND_IMAGE_REPOSITORY='${FRONTEND_IMAGE_REPOSITORY}' bash -s" \
            < scripts/rollback-production.sh
      - name: Verify public health endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            "${PRODUCTION_HEALTH_URL}"
      - name: Log out server from GitHub Container Registry
        if: always() && steps.configure-ssh.outcome == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -i ~/.ssh/inventory-deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "docker logout ghcr.io" || true
